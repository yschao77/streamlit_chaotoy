name: Sync Drive sources

# Runs on GitHub-hosted runners, so it is independent of the Streamlit Cloud app:
# the sync works whether that app is awake or asleep. `repository_dispatch` lets an
# external scheduler start a run when GitHub's own cron queue drops the schedule.
on:
  schedule:
    # 07:00 Taipei
    - cron: "0 23 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-drive]
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "utils.py"
      - "requirements.txt"
      - ".github/workflows/sync-shopee.yml"

permissions:
  contents: read

concurrency:
  group: sync-drive-sources
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Show trigger
        run: |
          echo "event=${{ github.event_name }}"
          echo "schedule=${{ github.event.schedule }}"
          echo "actor=${{ github.actor }}"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          {
            echo "### Trigger"
            echo "- event: \`${{ github.event_name }}\`"
            echo "- actor: \`${{ github.actor }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Wake Streamlit app
        if: vars.STREAMLIT_APP_URL != ''
        continue-on-error: true
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL" || echo 000)
          echo "streamlit_http_status=$status"
          echo "- streamlit app: \`$status\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force --detach FETCH_HEAD
      - name: Install dependencies
        run: python3 -m pip install --user -r requirements.txt
      - name: Correct latest mass_update into Shopee master
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sync_shopee_from_gdrive.py
      - name: Rebuild price summary from three tables
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sync_price_summary.py
      - name: Fill latest Sitegiant UPC file
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sync_sitegiant_upc.py
      - name: Report spreadsheet modified times
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STATUS_MAIL_TO: ${{ secrets.STATUS_MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 scripts/report_gdrive_status.py
