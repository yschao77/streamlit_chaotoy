name: Sync Drive sources

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # #region agent log
      - name: Debug trigger metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "sessionId=2c11ef"
          echo "hypothesisId=A-E"
          echo "event_name=$EVENT_NAME"
          echo "event.schedule=$EVENT_SCHEDULE"
          echo "ref=$GIT_REF"
          echo "actor=$ACTOR"
          echo "run_id=$RUN_ID"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          {
            echo "### Debug trigger"
            echo "- event_name: \`$EVENT_NAME\`"
            echo "- schedule: \`$EVENT_SCHEDULE\`"
            echo "- ref: \`$GIT_REF\`"
            echo "- actor: \`$ACTOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # #endregion
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Correct latest mass_update into Shopee master
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_shopee_from_gdrive.py
      - name: Rebuild price summary from three tables
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_price_summary.py
      - name: Fill latest Sitegiant UPC file
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_sitegiant_upc.py
      - name: Report spreadsheet modified times
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STATUS_MAIL_TO: ${{ secrets.STATUS_MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python scripts/report_gdrive_status.py
