# TEMPORARY: schedule-probe only. Does not touch Drive/Excel.
# Delete this file after confirming whether GitHub fires `schedule` at all.
name: Debug schedule probe

on:
  schedule:
    - cron: "15,45 * * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      # #region agent log
      - name: Record whether GitHub fired schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW: ${{ github.workflow }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "sessionId=2c11ef"
          echo "hypothesisId=F"
          echo "event_name=$EVENT_NAME"
          echo "event.schedule=$EVENT_SCHEDULE"
          echo "ref=$GIT_REF"
          echo "actor=$ACTOR"
          echo "run_id=$RUN_ID"
          echo "workflow=$WORKFLOW"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          echo "taipei=$(TZ=Asia/Taipei date +%Y-%m-%dT%H:%M:%S)"
          META=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '{private:.private,fork:.fork,default_branch:.default_branch,visibility:.visibility}')
          echo "repo_meta=$META"
          {
            echo "### Debug schedule probe"
            echo "- event_name: \`$EVENT_NAME\`"
            echo "- schedule: \`$EVENT_SCHEDULE\`"
            echo "- repo: \`$META\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # #endregion
