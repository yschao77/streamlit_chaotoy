name: Sync Drive sources

on:
  schedule:
    - cron: "30,40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # #region agent log
      - name: Debug trigger metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          GIT_REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "sessionId=2c11ef"
          echo "hypothesisId=G"
          echo "event_name=$EVENT_NAME"
          echo "event.schedule=$EVENT_SCHEDULE"
          echo "ref=$GIT_REF"
          echo "actor=$ACTOR"
          echo "run_id=$RUN_ID"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"
          {
            echo "### Debug trigger"
            echo "- event_name: \`$EVENT_NAME\`"
            echo "- schedule: \`$EVENT_SCHEDULE\`"
            echo "- ref: \`$GIT_REF\`"
            echo "- actor: \`$ACTOR\`"
          } >> "$GITHUB_STEP_SUMMARY"
      # #endregion
      - name: Checkout repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # #region agent log
          echo "sessionId=2c11ef"
          echo "hypothesisId=G"
          echo "checkout_method=git_fetch"
          echo "sha=${GITHUB_SHA}"
          # #endregion
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: bearer ${GH_TOKEN}" fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force --detach FETCH_HEAD
          test -f scripts/sync_shopee_from_gdrive.py
      - name: Install dependencies
        run: |
          python3 --version
          python3 -m pip install --user -r requirements.txt
      - name: Correct latest mass_update into Shopee master
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sync_shopee_from_gdrive.py
      - name: Rebuild price summary from three tables
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sync_price_summary.py
      - name: Fill latest Sitegiant UPC file
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/sync_sitegiant_upc.py
      - name: Report spreadsheet modified times
        if: always()
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          STATUS_MAIL_TO: ${{ secrets.STATUS_MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 scripts/report_gdrive_status.py
